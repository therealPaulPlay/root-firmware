name: Build and Release

on:
  release:
    types: [published]

env:
  GO_VERSION: '1.23'

jobs:
  build-firmware:
    name: Build Firmware Binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build for ARM (Pi Zero 2W)
        env:
          CC: arm-linux-gnueabihf-gcc
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_LDFLAGS: "-L${{ github.workspace }}/build/onnx-precompiled"
        run: |
          go build \
            -ldflags "-X 'root-firmware/pkg/globals.FirmwareVersion=${{ steps.version.outputs.version }}'" \
            -o root-firmware \
            cmd/main.go

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binary
          path: root-firmware
          retention-days: 1

  build-image-and-bundle:
    name: Build Image and RAUC Bundle
    runs-on: ubuntu-latest
    needs: build-firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware binary
        uses: actions/download-artifact@v4
        with:
          name: firmware-binary
          path: ./firmware-artifact/

      - name: Prepare pi-gen stage
        run: |
          # Place files directly in stage directory - pi-gen will copy these
          # and they'll be accessible via the stage directory path in scripts
          cp ./firmware-artifact/root-firmware build/pi-gen/stage-root-observer/
          echo "${{ secrets.RAUC_CA_CERT }}" > build/pi-gen/stage-root-observer/rauc-ca.cert.pem
          cp build/onnx-precompiled/libonnxruntime.so.1.23.2 build/pi-gen/stage-root-observer/
          cp build/rauc/raspberrypi-firmware-backend build/pi-gen/stage-root-observer/

      - name: Build image with pi-gen
        uses: usimd/pi-gen-action@v1
        id: build-image
        with:
          image-name: root-observer-${{ needs.build-firmware.outputs.version }}
          stage-list: 'stage0 stage1 stage2 ./build/pi-gen/stage-root-observer'
          release: trixie
          hostname: ROOT-Observer
          username: observer
          enable-ssh: 1
          compression: none
          locale: en_US.UTF-8
          verbose-output: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted kpartx dosfstools e2fsprogs rauc squashfs-tools

      - name: Repartition image for A/B layout
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"
          INPUT_IMG="${{ steps.build-image.outputs.image-path }}"

          echo "Input image: $INPUT_IMG"
          ls -la "$INPUT_IMG"

          sudo ./build/scripts/repartition-image.sh "$INPUT_IMG" "root-observer-${VERSION}.img"

      - name: Extract rootfs and create RAUC bundle
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"

          # Extract rootfs partition (partition 2) before compressing the full image
          sudo ./build/scripts/extract-rootfs.sh "root-observer-${VERSION}.img" rootfs.img 2

          # Compress the full image
          gzip -9 "root-observer-${VERSION}.img"

          # Write signing credentials
          echo "${{ secrets.RAUC_SIGNING_KEY }}" > signing.key.pem
          echo "${{ secrets.RAUC_SIGNING_CERT }}" > signing.cert.pem
          chmod 600 signing.key.pem

          # Create signed RAUC bundle
          ./build/scripts/build-bundle.sh \
            rootfs.img \
            "$VERSION" \
            signing.key.pem \
            signing.cert.pem \
            "root-observer-update-${VERSION}.raucb"

          # Clean up
          rm -f signing.key.pem signing.cert.pem rootfs.img

      - name: Calculate bundle hash and create metadata
        id: bundle-hash
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"
          BUNDLE="root-observer-update-${VERSION}.raucb"

          SHA256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BUNDLE")

          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT

          echo "Bundle: $BUNDLE (SHA256: $SHA256, Size: $SIZE bytes)"

          printf '{\n  "version": "%s",\n  "sha256": "%s",\n  "size": %s,\n  "filename": "root-observer-update-%s.raucb",\n  "compatible": "root-observer",\n  "releasedAt": "%s"\n}\n' \
            "$VERSION" "$SHA256" "$SIZE" "$VERSION" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            root-observer-*.img.gz
            root-observer-update-*.raucb
            latest.json
          retention-days: 1

  upload-to-s3:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: [build-firmware, build-image-and-bundle]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install

      - name: Configure AWS CLI for DigitalOcean Spaces
        run: |
          aws configure set aws_access_key_id ${{ secrets.S3_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.S3_SECRET_ACCESS_KEY }}
          aws configure set default.region ${{ secrets.S3_REGION }}

      - name: Clean old files and upload new ones to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          S3_ENDPOINT: https://${{ secrets.S3_REGION }}.${{ secrets.S3_DOMAIN }}
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"

          echo "Cleaning old files..."
          aws s3 rm "s3://${S3_BUCKET}/rootprivacy/images/" --endpoint-url "$S3_ENDPOINT" --recursive
          aws s3 rm "s3://${S3_BUCKET}/rootprivacy/updates/" --endpoint-url "$S3_ENDPOINT" --recursive

          echo "Uploading full image..."
          aws s3 cp "artifacts/root-observer-${VERSION}.img.gz" \
            "s3://${S3_BUCKET}/rootprivacy/images/root-observer-${VERSION}.img.gz" \
            --endpoint-url "$S3_ENDPOINT" --acl public-read

          echo "Uploading RAUC bundle..."
          aws s3 cp "artifacts/root-observer-update-${VERSION}.raucb" \
            "s3://${S3_BUCKET}/rootprivacy/updates/root-observer-update-${VERSION}.raucb" \
            --endpoint-url "$S3_ENDPOINT" --acl public-read

          echo "Uploading latest.json..."
          aws s3 cp "artifacts/latest.json" \
            "s3://${S3_BUCKET}/rootprivacy/updates/latest.json" \
            --endpoint-url "$S3_ENDPOINT" --acl public-read --content-type "application/json"

          echo "Upload complete!"

      - name: Update GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.img.gz
            artifacts/*.raucb
