name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.3-dev.1)"
        required: true

env:
  IS_RELEASE: ${{ github.event_name == 'release' }}

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run tests
        run: go test ./...

  build-firmware:
    name: Build firmware binary
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Extract version
        id: version
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Version is empty"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build for ARM64
        env:
          CC: aarch64-linux-gnu-gcc
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
          CGO_LDFLAGS: "-L${{ github.workspace }}/build/libs-precompiled"
        run: |
          go build \
            -ldflags "-X 'root-firmware/pkg/globals.FirmwareVersion=${{ steps.version.outputs.version }}'" \
            -o root-firmware \
            cmd/main.go

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binary
          path: root-firmware
          retention-days: 1

  build-image-and-bundle:
    name: Build image and RAUC bundle
    runs-on: ubuntu-24.04-arm # Pi-gen needs to run arm64 binaries in its container
    needs: build-firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware binary
        uses: actions/download-artifact@v4
        with:
          name: firmware-binary
          path: ./firmware-artifact/

      - name: Prepare pi-gen stage
        run: |
          # Place files directly in stage directory - pi-gen will copy these
          # and they'll be accessible via the stage directory path in scripts
          cp ./firmware-artifact/root-firmware build/pi-gen/stage-root-observer/
          echo "${{ secrets.RAUC_CA_CERT }}" > build/pi-gen/stage-root-observer/rauc-ca.cert.pem
          cp build/libs-precompiled/libonnxruntime.so.1.23.2 build/pi-gen/stage-root-observer/
          cp build/libs-precompiled/libopenh264-2.5.1-linux-arm64.7.so build/pi-gen/stage-root-observer/
          cp build/rauc/raspberrypi-firmware-backend build/pi-gen/stage-root-observer/

      - name: Build image with pi-gen
        uses: usimd/pi-gen-action@v1
        id: build-image
        with:
          image-name: root-observer-${{ needs.build-firmware.outputs.version }}
          stage-list: 'stage0 stage1 stage2 ./build/pi-gen/stage-root-observer'
          pi-gen-version: arm64
          release: trixie
          hostname: ROOT-Observer
          username: observer
          compression: none
          locale: en_US.UTF-8
          verbose-output: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y parted kpartx dosfstools e2fsprogs rauc squashfs-tools

      - name: Repartition image for A/B layout
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"
          INPUT_IMG="${{ steps.build-image.outputs.image-path }}"

          echo "Input image: $INPUT_IMG"
          ls -la "$INPUT_IMG"

          sudo ./build/scripts/repartition-image.sh "$INPUT_IMG" "root-observer-${VERSION}.img"

      - name: Extract rootfs and create RAUC bundle
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"

          # Extract rootfs partition (partition 2) before creating variants & compression
          sudo ./build/scripts/extract-rootfs.sh "root-observer-${VERSION}.img" rootfs.img 2

          # Write signing credentials
          echo "${{ secrets.RAUC_SIGNING_KEY }}" > signing.key.pem
          echo "${{ secrets.RAUC_SIGNING_CERT }}" > signing.cert.pem
          chmod 600 signing.key.pem

          # Create signed RAUC bundle
          ./build/scripts/build-bundle.sh \
            rootfs.img \
            "$VERSION" \
            signing.key.pem \
            signing.cert.pem \
            "root-observer-update-${VERSION}.raucb"

          # Clean up
          rm -f signing.key.pem signing.cert.pem rootfs.img

      - name: Create config.txt variants
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"
          sudo ./build/scripts/create-config-variants.sh "root-observer-${VERSION}.img" "$VERSION"

      - name: Compress images
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"
          gzip -9 "root-observer-${VERSION}-auto-detect.img"
          gzip -9 "root-observer-${VERSION}-custom.img"

      - name: Calculate bundle hash and create metadata
        if: env.IS_RELEASE == 'true'
        id: bundle-hash
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"
          BUNDLE="root-observer-update-${VERSION}.raucb"

          SHA256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$BUNDLE")

          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT

          echo "Bundle: $BUNDLE (SHA256: $SHA256, Size: $SIZE bytes)"

          printf '{\n  "version": "%s",\n  "sha256": "%s",\n  "size": %s,\n  "filename": "root-observer-update-%s.raucb",\n  "compatible": "root-observer",\n  "releasedAt": "%s"\n}\n' \
            "$VERSION" "$SHA256" "$SIZE" "$VERSION" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            root-observer-*.img.gz
            root-observer-update-*.raucb
            latest.json
          if-no-files-found: ignore
          retention-days: 1

  upload-to-s3:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: [build-firmware, build-image-and-bundle]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f

      - name: Install and configure s3cmd
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_HOST: ${{ secrets.S3_REGION }}.${{ secrets.S3_DOMAIN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd

          # Create s3cmd config for DigitalOcean Spaces
          printf '%s\n' \
            "[default]" \
            "access_key = ${S3_ACCESS_KEY_ID}" \
            "secret_key = ${S3_SECRET_ACCESS_KEY}" \
            "host_base = ${S3_HOST}" \
            "host_bucket = %(bucket)s.${S3_HOST}" \
            "use_https = True" \
            > ~/.s3cfg

      - name: Upload dev images to S3
        if: env.IS_RELEASE == 'false'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"

          s3cmd rm "s3://${S3_BUCKET}/rootprivacy/images/dev/" --recursive --force || true
          s3cmd put "artifacts/root-observer-${VERSION}-auto-detect.img.gz" \
            "s3://${S3_BUCKET}/rootprivacy/images/dev/root-observer-${VERSION}-auto-detect.img.gz" \
            --acl-public
          s3cmd put "artifacts/root-observer-${VERSION}-custom.img.gz" \
            "s3://${S3_BUCKET}/rootprivacy/images/dev/root-observer-${VERSION}-custom.img.gz" \
            --acl-public

      - name: Upload release image and rauc bundle to S3
        if: env.IS_RELEASE == 'true'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          VERSION="${{ needs.build-firmware.outputs.version }}"

          echo "Cleaning old files..."
          s3cmd rm "s3://${S3_BUCKET}/rootprivacy/images/release/" --recursive --force || true
          s3cmd rm "s3://${S3_BUCKET}/rootprivacy/updates/release/" --recursive --force || true

          echo "Uploading images..."
          s3cmd put "artifacts/root-observer-${VERSION}-auto-detect.img.gz" \
            "s3://${S3_BUCKET}/rootprivacy/images/release/root-observer-${VERSION}-auto-detect.img.gz" \
            --acl-public
          s3cmd put "artifacts/root-observer-${VERSION}-custom.img.gz" \
            "s3://${S3_BUCKET}/rootprivacy/images/release/root-observer-${VERSION}-custom.img.gz" \
            --acl-public

          echo "Uploading RAUC bundle..."
          s3cmd put "artifacts/root-observer-update-${VERSION}.raucb" \
            "s3://${S3_BUCKET}/rootprivacy/updates/release/root-observer-update-${VERSION}.raucb" \
            --acl-public

          echo "Uploading latest.json..."
          s3cmd put "artifacts/latest.json" \
            "s3://${S3_BUCKET}/rootprivacy/updates/release/latest.json" \
            --acl-public --mime-type="application/json"

          echo "Upload complete!"

      - name: Update GitHub release with metadata
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/latest.json
