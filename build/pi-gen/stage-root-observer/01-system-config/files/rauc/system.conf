[system]
compatible=root-observer
bootloader=custom
# Status file in default location (/var/lib/rauc/status) - read-only rootfs
# will use bundle-download-size limit for safety
max-bundle-download-size=536870912

[keyring]
path=/etc/rauc/ca.cert.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/backend/raspberrypi-firmware

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
